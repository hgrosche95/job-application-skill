name: CI

# Bewusst nur ein Build-Check (kein lint/test wie im ai-trip-planer-Vorbild):
# job-application-skill hat aktuell weder ESLint-Konfiguration noch Tests -
# ein 1:1-kopiertes ci.yml würde hier sofort an fehlenden npm-Scripts
# scheitern. Lieber ein kleiner, ehrlicher Check, der tatsächlich etwas
# prüft, als ein größerer, der nur simuliert vorhandene Qualitätssicherung.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
